name: Bug report
description: Report reproducible behavior in the LMS.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, tokens, or private user data. Use the security policy for vulnerabilities.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend API
        - Student frontend
        - Instructor frontend
        - Setup or documentation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the URL or endpoint and the actions needed to trigger the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant errors with sensitive values removed.
    validations:
      required: true
